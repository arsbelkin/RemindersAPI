services:
  reminders-postrgres-db:
    image: postgres:latest
    container_name: postgresDb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgresDataVolume:/var/lib/postgresql

  redis:
    image: redis:7.2-alpine
    container_name: redis_scheduler
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec 
      --maxmemory 512mb 
      --maxmemory-policy noeviction


volumes:
  postgresDataVolume:
  redis_data:
    driver: local
